name: Gate A

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-a-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, Gate A contracts, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - run: npm ci
      - run: npm run verify

  browser-chromium-e2e:
    name: Browser Chromium E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm

      - run: npm ci
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Run the bounded Chromium browser suite
        run: npm run test:e2e -- --project=desktop
      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-a-playwright-evidence
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  macos-native-smoke:
    name: macOS native build and smoke
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm

      - run: npm ci
      - name: Build the unsigned debug application and run native smoke checks
        run: npm run verify:macos
