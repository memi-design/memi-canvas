name: Gate A

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-a-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, Gate A contracts, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Run focused Gate A V3 and shell contracts
        run: >-
          npx vitest run
          apps/web/src/canvas/CanvasWorkbench.v3-production.test.ts
          apps/web/src/canvas/canvas-workspace-persistence.test.ts
          apps/web/src/projects/local-design-canvas-v3.test.ts
          apps/web/src/canvas/runtime-capture-v3-materialization-adapter.test.ts
          apps/web/src/canvas/v3-workbench-session-controller.test.ts
          apps/web/src/canvas/workbench-inspector-v3-actions.test.ts
          apps/web/src/canvas/workbench-v3-intents.test.ts
          apps/web/src/canvas/workbench-v3-session-bridge.test.ts
          apps/web/src/canvas/workbench-history-actions.test.ts
          apps/web/src/runtime/runtime-client-canvas-document-persistence.test.ts
          packages/canvas-document/src/v3-replay-property.test.ts
          packages/protocol/src/canvas-v3.test.ts
          packages/shell-contract/src/editor-module-boundaries.test.ts
      - run: npm run build

  desktop-e2e:
    name: Desktop Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm

      - run: npm ci
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Run the bounded desktop browser suite
        run: npm run test:e2e -- --project=desktop
      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-a-playwright-evidence
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
